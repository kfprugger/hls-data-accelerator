files: ^src/
repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]

      - id: end-of-file-fixer
        name: end-of-file-fixer
        entry: end-of-file-fixer
        language: system
        types: [python]

      - id: check-docstring-first
        name: check-docstring-first
        entry: check-docstring-first
        language: system
        types: [python]

      - id: check-yaml
        name: check-yaml
        entry: check-yaml
        language: system
        args: [--allow-multiple-documents]
        types: [yaml]

      - id: check-json
        name: check-json
        entry: check-json
        language: system
        types: [json]

      - id: flake8
        name: flake8
        args: [--max-line-length, "350", "--ignore", "F811"]
        entry: flake8
        language: system
        types: [python]

      - id: isort
        name: isort (python)
        entry: isort
        language: system
        args: [-l, "180"]
        types: [python]
