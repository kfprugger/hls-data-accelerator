name: Databricks bundle tests

'on':
  push:
    paths:
      - 'azure-databricks/**'
      - 'rayfin-imaging/local/fixtures/databricks_proof.json'
      - '.github/workflows/databricks-bundle.yml'
  pull_request:
    paths:
      - 'azure-databricks/**'
      - 'rayfin-imaging/local/fixtures/databricks_proof.json'
      - '.github/workflows/databricks-bundle.yml'

permissions:
  contents: read

jobs:
  bundle-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install locked test dependencies
        run: >-
          python -m pip install --require-hashes -r azure-databricks/implementation/tests/requirements.lock
      - name: Exercise Databricks implementation tests
        run: python -m unittest discover -s azure-databricks/implementation/tests -v
