        \   {\n                      \"name\": \"high_cost_risk_tier\",\n                      \"expression\": \"`high_cost_risk_tier`\"\n                    },\n                    {\n                      \"name\": \"care_gap_measure\",\n                      \"expression\": \"`care_gap_measure`\"\n                    },\n                    {\n                      \"name\": \"condition_summary\",\n                      \"expression\": \"`condition_summary`\"\n                    }\n                  ],\n                  \"disaggregated\": true\n                }\n              }\n            ],\n            \"spec\": {\n              \"version\": 1,\n              \"widgetType\": \"table\",\n              \"encodings\": {\n                \"columns\": [\n                  {\n                    \"fieldName\": \"patient_name\",\n                    \"displayName\": \"Patient\"\n                  },\n                  {\n                    \"fieldName\": \"device_id\",\n            \
