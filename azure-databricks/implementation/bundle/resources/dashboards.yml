        \                      \"expression\": \"`alert_type`\"\n                    }\n                  ],\n                  \"disaggregated\": true\n                }\n              }\n            ],\n            \"spec\": {\n              \"version\": 3,\n              \"widgetType\": \"bar\",\n              \"encodings\": {\n                \"x\": {\n                  \"fieldName\": \"alert_tier\",\n                  \"scale\": {\n                    \"type\": \"categorical\"\n                  },\n                  \"displayName\": \"Alert Tier\"\n                },\n                \"y\": {\n                  \"fieldName\": \"alert_count\",\n                  \"scale\": {\n                    \"type\": \"quantitative\"\n                  },\n                  \"displayName\": \"Active Alerts\"\n                },\n                \"color\": {\n                  \"fieldName\": \"alert_type\",\n                  \"scale\": {\n                    \"type\": \"categorical\"\n        \
        \          },\n                  \"displayName\": \"Trigger Type\"\n                }\n              },\n              \"frame\": {\n                \"showTitle\": true,\n                \"title\": \"Bedside Telemetry Alerts (15-Min Window)\"\n              }\n            }\n          },\n          \"position\": {\n            \"x\": 0,\n            \"y\": 5,\n            \"width\": 3,\n            \"height\": 5\n          }\n        },\n        {\n          \"widget\": {\n            \"name\": \"bar_exec_payer\",\n            \"queries\": [\n              {\n                \"name\": \"main_query\",\n                \"query\": {\n                  \"datasetName\": \"ds_exec_payer_queue\",\n                  \"fields\": [\n                    {\n                      \"name\": \"alert_domain\",\n                      \"expression\": \"`alert_domain`\"\n                    },\n                    {\n                      \"name\": \"queue_items\",\n                      \"expression\"\
        : \"`queue_items`\"\n                    },\n                    {\n                      \"name\": \"priority\",\n                      \"expression\": \"`priority`\"\n                    }\n                  ],\n                  \"disaggregated\": true\n                }\n              }\n            ],\n            \"spec\": {\n              \"version\": 3,\n              \"widgetType\": \"bar\",\n              \"encodings\": {\n                \"x\": {\n                  \"fieldName\": \"alert_domain\",\n                  \"scale\": {\n                    \"type\": \"categorical\"\n                  },\n                  \"displayName\": \"Payer Domain\"\n                },\n                \"y\": {\n                  \"fieldName\": \"queue_items\",\n                  \"scale\": {\n                    \"type\": \"quantitative\"\n                  },\n                  \"displayName\": \"Worklist Items\"\n                },\n                \"color\": {\n                  \"\
