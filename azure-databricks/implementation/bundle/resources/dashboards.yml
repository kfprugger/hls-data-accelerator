        \   },\n              \"frame\": {\n                \"showTitle\": true,\n                \"title\": \"Patient 360 Cohort\"\n              }\n            }\n          },\n          \"position\": {\n            \"x\": 0,\n            \"y\": 2,\n            \"width\": 1,\n            \"height\": 3\n          }\n        },\n        {\n          \"widget\": {\n            \"name\": \"kpi_exec_devices\",\n            \"queries\": [\n              {\n                \"name\": \"main_query\",\n                \"query\": {\n                  \"datasetName\": \"ds_exec_kpis\",\n                  \"fields\": [\n                    {\n                      \"name\": \"active_masimo_devices\",\n                      \"expression\": \"`active_masimo_devices`\"\n                    }\n                  ],\n                  \"disaggregated\": true\n                }\n              }\n            ],\n            \"spec\": {\n              \"version\": 2,\n              \"widgetType\": \"counter\"\
        ,\n              \"encodings\": {\n                \"value\": {\n                  \"fieldName\": \"active_masimo_devices\",\n                  \"displayName\": \"Monitored Devices\"\n                }\n              },\n              \"frame\": {\n                \"showTitle\": true,\n                \"title\": \"Masimo Devices\"\n              }\n            }\n          },\n          \"position\": {\n            \"x\": 1,\n            \"y\": 2,\n            \"width\": 1,\n            \"height\": 3\n          }\n        },\n        {\n          \"widget\": {\n            \"name\": \"kpi_exec_alerts\",\n            \"queries\": [\n              {\n                \"name\": \"main_query\",\n                \"query\": {\n                  \"datasetName\": \"ds_exec_kpis\",\n                  \"fields\": [\n                    {\n                      \"name\": \"active_clinical_alerts\",\n                      \"expression\": \"`active_clinical_alerts`\"\n                    }\n \
        \                 ],\n                  \"disaggregated\": true\n                }\n              }\n            ],\n            \"spec\": {\n              \"version\": 2,\n              \"widgetType\": \"counter\",\n              \"encodings\": {\n                \"value\": {\n                  \"fieldName\": \"active_clinical_alerts\",\n                  \"displayName\": \"Active Alerts\"\n                }\n              },\n              \"frame\": {\n                \"showTitle\": true,\n                \"title\": \"15m Clinical Alerts\"\n              }\n            }\n          },\n          \"position\": {\n            \"x\": 2,\n            \"y\": 2,\n            \"width\": 1,\n            \"height\": 3\n          }\n        },\n        {\n          \"widget\": {\n            \"name\": \"kpi_exec_studies\",\n            \"queries\": [\n              {\n                \"name\": \"main_query\",\n                \"query\": {\n                  \"datasetName\": \"ds_exec_kpis\"\
