        \            \"y\": 2,\n            \"width\": 1,\n            \"height\": 3\n          }\n        },\n        {\n          \"widget\": {\n            \"name\": \"kpi_clin_devs\",\n            \"queries\": [\n              {\n                \"name\": \"main_query\",\n                \"query\": {\n                  \"datasetName\": \"ds_clin_kpis\",\n                  \"fields\": [\n                    {\n                      \"name\": \"assigned_devices\",\n                      \"expression\": \"`assigned_devices`\"\n                    }\n                  ],\n                  \"disaggregated\": true\n                }\n              }\n            ],\n            \"spec\": {\n              \"version\": 2,\n              \"widgetType\": \"counter\",\n              \"encodings\": {\n                \"value\": {\n                  \"fieldName\": \"assigned_devices\",\n                  \"displayName\": \"Assigned Devices\"\n                }\n              },\n              \"\
