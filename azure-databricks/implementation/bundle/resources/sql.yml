resources:
  # The serverless SQL warehouse is created during the Unity Catalog bootstrap,
  # because that bootstrap itself needs a warehouse before the bundle can resolve
  # catalog-backed pipelines and alerts.
  # Replaces ClinicalAlertActivator. The query owns tier and cooldown, not the alert engine.
  alerts:
    hls_clinical_alert:
      display_name: HLS clinical deterioration alert
      warehouse_id: ${var.warehouse_id}
      query_text: |
        SELECT count(*) AS qualifying_alerts
        FROM ${var.catalog}.silver.clinical_alert_candidates
        WHERE alert_tier IN ('URGENT', 'CRITICAL')
          AND suppressed_by_cooldown = false
          AND observed_at >= current_timestamp() - INTERVAL 15 MINUTES
      evaluation:
        comparison_operator: GREATER_THAN
        source:
          name: qualifying_alerts
          aggregation: MAX
        threshold:
          value:
            double_value: 0
        notification:
          notify_on_ok: false
          retrigger_seconds: 900
          subscriptions:
            - user_email: ${var.alert_email}
      schedule:
        quartz_cron_schedule: "0 0/5 * * * ?"
        timezone_id: America/New_York
        pause_status: PAUSED
