id: rayfin-health-command-center
name: rayfin-health-command-center
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - https://oaken-cove-7a1eb21ad7-westus2.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: true
    buildCommand: npm run build
publishable_key: pk-bq8EbZqob-CgQ-0g-St5
secrets:
  - name: SQL_SERVER
    description: "TDS host of the app SQL database used by the trusted publishSnapshot function"
  - name: SQL_DATABASE
    description: "Name of the app SQL database used by the trusted publishSnapshot function"
