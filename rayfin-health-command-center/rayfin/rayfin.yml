id: rayfin-health-command-center
name: rayfin-health-command-center
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://key-light-c976f47909-westus2.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: false
  staticHosting:
    enabled: true
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
  functions:
    enabled: true
    auth:
      type: application
    buildCommand: npm run build
publishable_key: pk-KrLZyjaeil6IIjvc-cwY
secrets:
  - name: SQL_SERVER
    description: TDS host of the app SQL database used by the trusted publishSnapshot function
  - name: SQL_DATABASE
    description: Name of the app SQL database used by the trusted publishSnapshot function
